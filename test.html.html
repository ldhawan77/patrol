<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkpoint Part 2 Test Page</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 22px; color: #1F3A7A; }
  label { display: block; margin-top: 14px; font-weight: bold; }
  input { width: 100%; padding: 8px; font-size: 15px; box-sizing: border-box; margin-top: 4px; }
  button { margin-top: 14px; padding: 10px 14px; font-size: 15px; background: #0B4DA2; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button.grey { background: #666; }
  #out { margin-top: 20px; padding: 12px; background: #EAF1FB; border: 1px solid #0B4DA2; border-radius: 6px; white-space: pre-wrap; min-height: 60px; }
  .small { color: #555; font-size: 13px; }
</style>
</head>
<body>
<h1>Checkpoint Part 2: can the page read the reply?</h1>
<p class="small">This page only talks to your Checkpoint Test Site sheet. Your secret is typed in here and is not saved in this file.</p>

<label for="url">Web app URL (ends in /exec)</label>
<input id="url" type="text" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">

<label for="secret">Secret</label>
<input id="secret" type="password" autocomplete="off">

<button id="b1">1. Send a new test scan</button>
<button id="b2" class="grey">2. Send the exact same scan again</button>
<button id="b3" class="grey">3. Send with a wrong secret</button>

<div id="out">Results appear here.</div>

<script>
let last = null;
const out = document.getElementById("out");

function now() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

async function send(scan, secret, label) {
  const url = document.getElementById("url").value.trim();
  if (!url) { out.textContent = "Please paste the Web app URL first."; return; }
  const body = new URLSearchParams({
    secret: secret, site: scan.site, phone: scan.phone, tag: scan.tag,
    phonetime: scan.phonetime, point: scan.point, type: "scan"
  });
  out.textContent = label + "\nSending...";
  const started = Date.now();
  try {
    const r = await fetch(url, { method: "POST", body: body });
    const text = await r.text();
    out.textContent = label + "\nRESULT: the page CAN read the reply.\nReply: " + text +
      "\nHTTP status: " + r.status + "\nTook " + (Date.now() - started) + " ms";
  } catch (err) {
    out.textContent = label + "\nRESULT: the page could NOT read the reply.\nError: " + err +
      "\nThe scan may still have reached the sheet. Please check the sheet.";
  }
}

document.getElementById("b1").onclick = () => {
  last = { site: "Checkpoint Test Site", phone: "TestPage", tag: "QRTEST0003", phonetime: now(), point: "TestPoint" };
  send(last, document.getElementById("secret").value, "Test 1: new scan, phone time " + last.phonetime);
};
document.getElementById("b2").onclick = () => {
  if (!last) { out.textContent = "Press button 1 first."; return; }
  send(last, document.getElementById("secret").value, "Test 2: same scan again, phone time " + last.phonetime);
};
document.getElementById("b3").onclick = () => {
  const s = { site: "Checkpoint Test Site", phone: "TestPage", tag: "QRTEST0004", phonetime: now(), point: "TestPoint" };
  send(s, "thisiswrong", "Test 3: wrong secret");
};
</script>
</body>
</html>
